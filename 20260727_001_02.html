<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Pretendard",sans-serif;background:#f4f5f7;min-height:100vh;word-break:keep-all}
.center{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.box{background:#fff;border:1px solid #e4e6ea;border-radius:16px;padding:36px 32px;width:100%;max-width:380px;text-align:center;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.box svg{width:40px;height:40px;margin-bottom:14px}
.box h1{font-size:17px;font-weight:700;color:#16181d;margin-bottom:6px}
.box p{font-size:13px;color:#6b7078;font-weight:500;margin-bottom:18px}
.box input{width:100%;font-family:inherit;font-size:15px;font-weight:500;color:#16181d;border:1.5px solid #e4e6ea;border-radius:10px;padding:11px 14px;text-align:center}
.box input:focus{outline:none;border-color:#2456e6}
.box button{font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;border:none;border-radius:10px;padding:11px 20px;background:#2456e6;color:#fff;margin-top:12px;min-width:120px}
.box button:disabled{opacity:.5;cursor:not-allowed}
.err{font-size:12.5px;color:#e0453c;font-weight:600;margin-top:10px;display:none}
.err.show{display:block}
#viewer{display:none;padding:0}
#viewer img{display:block;width:100%;max-width:1000px;margin:0 auto;user-select:none;-webkit-user-drag:none}
</style>
</head>

function b64d(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0)})}
async function unlock(){
 var btn=document.getElementById("go"),err=document.getElementById("err"),pw=document.getElementById("pw").value;
 err.classList.remove("show");btn.disabled=true;btn.textContent="확인 중…";
 try{
  var base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  var key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64d(SALT),iterations:150000,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  var plain=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64d(IV)},key,b64d(DATA));
  var dataUrl=new TextDecoder().decode(plain);
  var img=document.createElement("img");img.src=dataUrl;img.alt="";
  document.getElementById("viewer").appendChild(img);
  document.getElementById("lock").style.display="none";
  document.getElementById("viewer").style.display="block";
  document.body.style.background="#ffffff";
 }catch(e){
  err.classList.add("show");document.getElementById("pw").value="";document.getElementById("pw").focus();
  btn.disabled=false;btn.textContent="열기";
 }
}
document.getElementById("go").addEventListener("click",unlock);
document.getElementById("pw").addEventListener("keydown",function(e){if(e.key==="Enter")unlock()});
document.addEventListener("contextmenu",function(e){if(document.getElementById("viewer").style.display==="block")e.preventDefault()});
</script>
